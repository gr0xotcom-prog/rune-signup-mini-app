<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Запись на руну</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <style>
:root {
  --bg: var(--tg-theme-bg-color, #0d1420);
  --text: var(--tg-theme-text-color, #f7f9fc);
  --muted: var(--tg-theme-hint-color, #8d99aa);
  --card: var(--tg-theme-secondary-bg-color, #182334);
  --button: var(--tg-theme-button-color, #6c5ce7);
  --button-text: var(--tg-theme-button-text-color, #ffffff);
  --accent: #b9a7ff;
  --line: rgba(255, 255, 255, .09);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  color: var(--text);
  background:
    radial-gradient(circle at 88% 4%, rgba(108, 92, 231, .32), transparent 32%),
    radial-gradient(circle at 8% 36%, rgba(47, 179, 255, .12), transparent 30%),
    var(--bg);
}

.page {
  width: min(100%, 520px);
  margin: 0 auto;
  padding: max(22px, env(safe-area-inset-top)) 18px max(30px, env(safe-area-inset-bottom));
}

.hero { display: flex; gap: 16px; align-items: flex-start; margin: 5px 0 26px; }
.rune {
  flex: 0 0 58px;
  height: 58px;
  display: grid;
  place-items: center;
  border-radius: 18px;
  font: 700 32px Georgia, serif;
  color: #fff;
  background: linear-gradient(145deg, #8a75ff, #5542cf);
  box-shadow: 0 12px 30px rgba(94, 72, 220, .35);
}
.eyebrow { margin: 1px 0 5px; color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: .14em; }
h1 { margin: 0; font-size: clamp(24px, 7vw, 34px); line-height: 1.08; letter-spacing: -.035em; }
.lead { margin: 9px 0 0; color: var(--muted); font-size: 14px; line-height: 1.45; }

form { display: grid; gap: 13px; }
.card {
  padding: 17px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: color-mix(in srgb, var(--card) 94%, transparent);
  box-shadow: 0 12px 28px rgba(0, 0, 0, .14);
}
label, .field-title { display: flex; align-items: center; gap: 12px; }
.number {
  width: 31px;
  height: 31px;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  border-radius: 10px;
  color: var(--accent);
  background: rgba(133, 111, 255, .15);
  font-weight: 800;
}
label span:last-child, .field-title span:last-child { display: grid; gap: 2px; }
b { font-size: 16px; }
small { color: var(--muted); font-size: 12px; }

input {
  width: 100%;
  height: 52px;
  margin-top: 15px;
  padding: 0 15px;
  border: 1px solid var(--line);
  border-radius: 15px;
  outline: none;
  color: var(--text);
  background: rgba(0, 0, 0, .16);
  font: inherit;
  font-size: 16px;
  transition: border-color .2s, box-shadow .2s;
}
input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(155, 133, 255, .14); }
input::-webkit-calendar-picker-indicator { filter: invert(.8); opacity: .8; }
.error { min-height: 15px; margin: 6px 2px -3px; color: #ff8292; font-size: 12px; }

.clock { position: relative; display: flex; justify-content: center; align-items: center; gap: 7px; margin-top: 14px; }
.wheel-wrap { position: relative; width: 105px; text-align: center; z-index: 1; }
.wheel-label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .12em; }
.wheel {
  height: 150px;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
  mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent);
  overscroll-behavior: contain;
  touch-action: none;
  -webkit-overflow-scrolling: touch;
  cursor: grab;
  user-select: none;
}
.wheel.dragging { cursor: grabbing; scroll-snap-type: none; }
.wheel::-webkit-scrollbar { display: none; }
.wheel::before, .wheel::after { content: ""; display: block; height: 50px; }
.wheel-option {
  height: 50px;
  display: grid;
  place-items: center;
  scroll-snap-align: center;
  color: var(--muted);
  font: 700 29px ui-monospace, "SFMono-Regular", Consolas, monospace;
  transition: color .18s, transform .18s;
}
.wheel-option.active { color: var(--text); transform: scale(1.12); }
.colon { margin-top: 18px; color: var(--accent); font: 800 30px ui-monospace, monospace; }
.selection {
  position: absolute;
  left: 50%;
  top: 80px;
  width: 230px;
  height: 50px;
  transform: translate(-50%, -50%);
  border: 1px solid rgba(165, 145, 255, .32);
  border-radius: 14px;
  background: rgba(130, 105, 255, .08);
  pointer-events: none;
}

.submit {
  height: 58px;
  margin-top: 6px;
  border: 0;
  border-radius: 18px;
  color: var(--button-text);
  background: linear-gradient(135deg, color-mix(in srgb, var(--button) 80%, #a88cff), var(--button));
  box-shadow: 0 12px 26px color-mix(in srgb, var(--button) 34%, transparent);
  font: inherit;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
}
.submit:active { transform: translateY(1px); }
.submit:disabled { opacity: .72; cursor: wait; }
.status { min-height: 20px; margin: 0; text-align: center; color: var(--muted); font-size: 13px; }

@media (prefers-color-scheme: light) {
  :root { --line: rgba(41, 31, 78, .1); }
  body { background-color: var(--bg); }
  input { background: rgba(90, 67, 140, .055); }
  input::-webkit-calendar-picker-indicator { filter: none; }
}

  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <div class="rune" aria-hidden="true">ᚱ</div>
      <div>
        <p class="eyebrow">РАЗДЕЛ ГРУППЫ</p>
        <h1 id="section-title">Запись на руну</h1>
        <p class="lead">Заполните данные — запись сразу получит администратор.</p>
      </div>
    </header>

    <form id="signup-form" novalidate>
      <section class="card">
        <label for="nickname">
          <span class="number">1</span>
          <span><b>Игровой ник</b><small>Как вас найти в игре</small></span>
        </label>
        <input id="nickname" name="nickname" type="text" maxlength="40"
               autocomplete="nickname" placeholder="Введите игровой ник" required>
        <p class="error" id="nickname-error"></p>
      </section>

      <section class="card">
        <label for="event-date">
          <span class="number">2</span>
          <span><b>Дата</b><small>Год, месяц и день</small></span>
        </label>
        <input id="event-date" name="event-date" type="date" required>
        <p class="error" id="date-error"></p>
      </section>

      <section class="card time-card">
        <div class="field-title">
          <span class="number">3</span>
          <span><b>Время</b><small>Прокрутите часы и минуты</small></span>
        </div>
        <div class="clock" aria-label="Выбор времени">
          <div class="wheel-wrap">
            <span class="wheel-label">ЧАСЫ</span>
            <div class="wheel" id="hours" role="listbox" tabindex="0"></div>
          </div>
          <span class="colon" aria-hidden="true">:</span>
          <div class="wheel-wrap">
            <span class="wheel-label">МИНУТЫ</span>
            <div class="wheel" id="minutes" role="listbox" tabindex="0"></div>
          </div>
          <div class="selection" aria-hidden="true"></div>
        </div>
      </section>

      <button class="submit" type="submit">Подтвердить запись</button>
      <p class="status" id="status" role="status"></p>
    </form>
  </main>
  <script>
const tg = window.Telegram?.WebApp;
const form = document.querySelector('#signup-form');
const nickname = document.querySelector('#nickname');
const dateInput = document.querySelector('#event-date');
const status = document.querySelector('#status');
const params = new URLSearchParams(window.location.search);
const sectionId = params.get('section_id') || '0';
const sectionName = (params.get('section_name') || 'Запись на руну').trim().slice(0, 32);
document.querySelector('#section-title').textContent = sectionName;

tg?.ready();
tg?.expand();

function localIsoDate(date = new Date()) {
  const offset = date.getTimezoneOffset() * 60000;
  return new Date(date.getTime() - offset).toISOString().slice(0, 10);
}

dateInput.min = localIsoDate();
dateInput.value = localIsoDate();

function createWheel(id, count, initial) {
  const wheel = document.querySelector(`#${id}`);
  let value = initial;
  let settleTimer;
  let drag = null;
  for (let number = 0; number < count; number += 1) {
    const option = document.createElement('div');
    option.className = 'wheel-option';
    option.textContent = String(number).padStart(2, '0');
    option.dataset.value = String(number);
    option.setAttribute('role', 'option');
    option.addEventListener('click', () => wheel.scrollTo({ top: number * 50, behavior: 'smooth' }));
    wheel.append(option);
  }

  function select() {
    value = Math.max(0, Math.min(count - 1, Math.round(wheel.scrollTop / 50)));
    wheel.querySelectorAll('.wheel-option').forEach((option, index) => {
      option.classList.toggle('active', index === value);
      option.setAttribute('aria-selected', index === value ? 'true' : 'false');
    });
  }

  function settle(behavior = 'smooth') {
    const next = Math.max(0, Math.min(count - 1, Math.round(wheel.scrollTop / 50)));
    wheel.scrollTo({ top: next * 50, behavior });
    select();
  }

  wheel.addEventListener('scroll', () => {
    select();
    clearTimeout(settleTimer);
    if (!drag) {
      settleTimer = setTimeout(() => {
        settle();
        tg?.HapticFeedback?.selectionChanged();
      }, 110);
    }
  }, { passive: true });

  wheel.addEventListener('pointerdown', (event) => {
    if (event.pointerType === 'mouse' && event.button !== 0) return;
    clearTimeout(settleTimer);
    drag = {
      id: event.pointerId,
      y: event.clientY,
      top: wheel.scrollTop,
      lastY: event.clientY,
      lastTime: performance.now(),
      velocity: 0,
    };
    wheel.setPointerCapture?.(event.pointerId);
    wheel.classList.add('dragging');
    event.preventDefault();
  });

  wheel.addEventListener('pointermove', (event) => {
    if (!drag || drag.id !== event.pointerId) return;
    const now = performance.now();
    const elapsed = Math.max(1, now - drag.lastTime);
    drag.velocity = (drag.lastY - event.clientY) / elapsed;
    wheel.scrollTop = drag.top + drag.y - event.clientY;
    drag.lastY = event.clientY;
    drag.lastTime = now;
    event.preventDefault();
  });

  function finishDrag(event) {
    if (!drag || drag.id !== event.pointerId) return;
    const velocity = drag.velocity;
    drag = null;
    wheel.classList.remove('dragging');
    wheel.releasePointerCapture?.(event.pointerId);
    wheel.scrollTop += velocity * 115;
    settle();
    tg?.HapticFeedback?.selectionChanged();
  }

  wheel.addEventListener('pointerup', finishDrag);
  wheel.addEventListener('pointercancel', finishDrag);

  wheel.addEventListener('keydown', (event) => {
    if (!['ArrowUp', 'ArrowDown'].includes(event.key)) return;
    event.preventDefault();
    const direction = event.key === 'ArrowDown' ? 1 : -1;
    wheel.scrollTo({ top: Math.max(0, Math.min(count - 1, value + direction)) * 50, behavior: 'smooth' });
  });
  requestAnimationFrame(() => {
    wheel.scrollTop = initial * 50;
    select();
  });
  return () => String(value).padStart(2, '0');
}

const now = new Date();
const selectedHour = createWheel('hours', 24, now.getHours());
const selectedMinute = createWheel('minutes', 60, now.getMinutes());

function displayDate(iso) {
  const [year, month, day] = iso.split('-');
  return `${day}.${month}.${year}`;
}

function validate() {
  const nick = nickname.value.trim();
  const selectedDate = dateInput.value;
  document.querySelector('#nickname-error').textContent = nick ? '' : 'Введите игровой ник';
  document.querySelector('#date-error').textContent = selectedDate ? '' : 'Выберите дату';
  return nick && selectedDate ? { nick, selectedDate } : null;
}

form.addEventListener('submit', (event) => {
  event.preventDefault();
  const values = validate();
  if (!values) {
    tg?.HapticFeedback?.notificationOccurred('error');
    return;
  }
  const data = JSON.stringify({
    type: 'group_signup',
    section_id: sectionId,
    section_name: sectionName,
    nick: values.nick,
    date: displayDate(values.selectedDate),
    time: `${selectedHour()}:${selectedMinute()}`,
  });
  if (tg?.sendData) {
    const submit = form.querySelector('.submit');
    submit.disabled = true;
    submit.textContent = 'Отправляем…';
    status.textContent = 'Запись отправляется администратору';
    tg.HapticFeedback?.notificationOccurred('success');
    try {
      tg.sendData(data);
      window.setTimeout(() => {
        submit.disabled = false;
        submit.textContent = 'Повторить отправку';
        status.textContent = 'Telegram не подтвердил отправку. Откройте форму через кнопку раздела и повторите.';
      }, 4000);
    } catch (error) {
      submit.disabled = false;
      submit.textContent = 'Повторить отправку';
      status.textContent = 'Не удалось отправить запись. Вернитесь в бот и откройте форму заново.';
      tg.HapticFeedback?.notificationOccurred('error');
    }
  } else {
    status.textContent = 'Форма готова. Откройте её через кнопку Telegram-бота для отправки.';
  }
});

  </script>
</body>
</html>
